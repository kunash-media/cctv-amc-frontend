<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Reports — CCTV AMC Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#F0F3FB', surface: '#FFFFFF', surface2: '#FFFFFF', surface3: '#eef1fa',
                        borderc: '#cdd5ea', bordersoft: '#e1e6f3', textdim: '#3d4763', textfaint: '#7b85a3',
                        accent: '#1A328D', accentdim: '#e3f6ea', accenttext: '#1A328D',
                        amber: '#b07d1a', amberdim: '#f5e8cc', ambertext: '#b07d1a',
                        redc: '#c0392b', reddim: '#fbe4e1', redtext: '#c0392b',
                    },
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        html, body { background: #F0F3FB; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cdd5ea; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #9aa6c9; }

        .sidebar { background: #FFFFFF; transition: width 0.25s ease, transform 0.25s ease; width: 260px; overflow-x: hidden; flex-shrink: 0; }
        .sidebar.collapsed { width: 72px; }
        .sidebar.collapsed .sidebar-nav-text { display: none; }
        .sidebar.collapsed .sidebar-nav-item { justify-content: center; padding: 0.625rem; }
        .sidebar a:hover { background: rgba(0,0,0,0.06); color: #1a1a1a; }
        .sidebar a.active { background: linear-gradient(135deg, #1A328D, #234FAA) !important; color: white !important; width: 90%; margin-left: 10px; border-radius: 10px; }
        .sidebar a.active svg { stroke: white !important; }
        .sidebar { border-right-color: #e1e6f3; }

        .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; padding: 10px 20px; border-radius: 10px; background: linear-gradient(135deg, #1A328D, #234FAA); color: white; border: none; transition: filter 0.15s; cursor: pointer; text-decoration: none; min-height: 44px; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-secondary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; padding: 10px 20px; border-radius: 10px; background: #eef1fa; color: #1A328D; border: 1px solid #cdd5ea; transition: background 0.15s; cursor: pointer; text-decoration: none; min-height: 44px; }
        .btn-secondary:hover { background: #dfe6f7; }
        .btn-reset { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; padding: 10px 20px; border-radius: 10px; background: #7b85a3; color: white; border: none; transition: background 0.15s; cursor: pointer; min-height: 44px; }
        .btn-reset:hover { background: #3d4763; }

        .btn-export-excel { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 13px; padding: 8px 16px; border-radius: 8px; background: #1f8a4c; color: white; border: none; transition: background 0.15s; cursor: pointer; min-height: 40px; }
        .btn-export-excel:hover { background: #166538; }
        .btn-export-excel:disabled { opacity: .6; cursor: progress; }
        .btn-export-issue-excel { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 13px; padding: 8px 16px; border-radius: 8px; background: #b07d1a; color: white; border: none; transition: background 0.15s; cursor: pointer; min-height: 40px; }
        .btn-export-issue-excel:hover { background: #8a5f12; }
        .btn-approve { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 12px; padding: 6px 14px; border-radius: 6px; background: #1A328D; color: white; border: none; transition: background 0.15s; cursor: pointer; min-height: 34px; }
        .btn-approve:hover { background: #234FAA; }
        .btn-approve.approved { background: #7b85a3; cursor: default; }
        .btn-approve.approved:hover { background: #7b85a3; }

        .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; letter-spacing: .02em; }
        .chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .chip-active { background: #e3f6ea; color: #1f8a4c; }
        .chip-soon { background: #f5e8cc; color: #b07d1a; }
        .chip-approved { background: #e3f6ea; color: #1f8a4c; }
        .chip-pending { background: #f5e8cc; color: #b07d1a; }
        .chip-resolved { background: #e3f6ea; color: #1f8a4c; }
        .chip-open { background: #f5e8cc; color: #b07d1a; }
        .chip-progress { background: #dfe6f7; color: #1A328D; }
        .chip-closed { background: #eef1fa; color: #3d4763; }
        .chip-engineer { background: #eef1fa; color: #1A328D; font-family: 'Inter', sans-serif; }
        .chip-engineer::before { display: none; }

        .month-group { background: #FFFFFF; border: 1px solid #cdd5ea; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .month-group .month-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; color: #1A328D; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .month-group .month-title .count-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: #eef1fa; padding: 2px 10px; border-radius: 20px; color: #1A328D; }

        .report-card { background: white; border: 1px solid #cdd5ea; border-radius: 12px; padding: 16px; transition: all 0.15s; }
        .report-card:hover { box-shadow: 0 4px 12px rgba(26,50,141,0.08); }
        .issue-card-r { background: white; border: 1px solid #cdd5ea; border-radius: 12px; padding: 16px; transition: all 0.15s; border-left: 4px solid #c0392b; }
        .issue-card-r:hover { box-shadow: 0 4px 12px rgba(26,50,141,0.08); }
        .issue-card-r.resolved { border-left-color: #1f8a4c; }

        .visit-row { background: #f9fafd; border: 1px solid #e1e6f3; border-radius: 10px; padding: 10px 12px; }
        .visit-row + .visit-row { margin-top: 8px; }
        .sig-thumb { height: 28px; max-width: 90px; object-fit: contain; background: #fff; border: 1px solid #e1e6f3; border-radius: 6px; padding: 2px; }
        .no-sig-badge { font-size: 10.5px; color: #c0392b; background: #fbe4e1; padding: 2px 8px; border-radius: 999px; font-weight: 600; }

        .toast { position: fixed; bottom: 24px; right: 24px; background: #151929; border-left: 4px solid #1A328D; color: #e7edf0; padding: 12px 18px; border-radius: 12px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px -8px rgba(0,0,0,.5); z-index: 100; transform: translateY(20px); opacity: 0; transition: all .25s ease; pointer-events: none; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.toast-danger { border-left-color: #c0392b; }

        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
        .modal-backdrop.open { display: flex; }
        .modal { animation: modalIn .18s ease; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-card { background: white; border: 1px solid #cdd5ea; border-radius: 16px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 24px 48px -12px rgba(0,0,0,0.25); }

        .tab-btn { padding: 10px 24px; border: none; border-radius: 8px 8px 0 0; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; background: transparent; color: #7b85a3; border-bottom: 3px solid transparent; min-height: 44px; }
        .tab-btn.active { color: #1A328D; border-bottom-color: #1A328D; background: #eef1fa; }
        .tab-btn:hover { background: #eef1fa; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .dropdown-menu { opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.2s ease; }
        .dropdown-menu.open { opacity: 1; visibility: visible; transform: translateY(0); }

        .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: white; padding: 12px 16px; border-radius: 16px; border: 1px solid #cdd5ea; }
        .filter-bar select, .filter-bar input { background: #ffffff; border: 1px solid #cdd5ea; border-radius: 8px; padding: 8px 16px; font-size: 13px; min-width: 120px; min-height: 40px; color: #1A328D; }
        .filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: #1A328D; }
        .filter-bar button { background: #1A328D; color: white; border: none; border-radius: 8px; padding: 8px 18px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; min-height: 40px; }
        .filter-bar button:hover { filter: brightness(1.1); }

        input, select, textarea { background-color: white; border-color: #e1e6f3; }
        input:focus, select:focus, textarea:focus { border-color: #1A328D; outline: none; }

        /* Camera detail table in view modal */
        .cam-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        .cam-table th { background: #eef1fa; color: #1A328D; font-weight: 600; padding: 7px 10px; text-align: left; border: 1px solid #e1e6f3; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
        .cam-table td { padding: 6px 10px; border: 1px solid #e1e6f3; color: #151929; vertical-align: top; }
        .cam-table tr:nth-child(even) td { background: #f9fafd; }
        .cam-table tr:hover td { background: #f0f3fb; }
        .td-working-yes { color: #1f8a4c; font-weight: 600; }
        .td-working-no { color: #c0392b; font-weight: 600; }

        @media (max-width: 900px) {
            .sidebar { position: fixed; left: 0; top: 0; height: 100vh; transform: translateX(-100%); z-index: 40; background: #FFFFFF; width: 260px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar.collapsed { width: 260px; }
            .sidebar.collapsed .sidebar-nav-text { display: inline-block; }
            .sidebar.collapsed .sidebar-nav-item { justify-content: flex-start; padding: 0.625rem 0.75rem; }
        }
        @media (max-width: 640px) {
            .filter-bar { flex-direction: column; align-items: stretch; padding: 12px; gap: 8px; }
            .filter-bar select, .filter-bar input { min-width: unset; width: 100%; font-size: 14px; padding: 10px 16px; min-height: 44px; }
            .filter-bar button { width: 100%; justify-content: center; padding: 10px 16px; font-size: 14px; min-height: 44px; }
            .tab-btn { padding: 8px 12px; font-size: 12px; }
            .report-card .actions { flex-wrap: wrap; }
            .report-card .actions button { flex: 1; min-width: 60px; font-size: 11px; padding: 6px 10px; min-height: 34px; }
            .toast { bottom: 16px; right: 16px; left: 16px; max-width: 400px; margin: 0 auto; font-size: 12px; }
            .cam-table { font-size: 11px; }
            .cam-table th, .cam-table td { padding: 4px 6px; }
        }
    </style>
</head>
<body class="text-[#151929]">

    <!-- HEADER -->
    <header class="bg-white/90 backdrop-blur-sm border-b border-[#e1e6f3] sticky top-0 z-30 shadow-sm">
        <div class="flex items-center justify-between px-4 md:px-6 py-3">
            <div class="flex items-center gap-3">
                <button id="sidebarToggleBtn" class="w-10 h-10 flex items-center justify-center rounded-md border border-[#cdd5ea] text-[#234FAA] hover:bg-[#234FAA] hover:text-white transition md:hidden">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <button id="sidebarCollapseBtn" class="hidden md:flex w-10 h-10 items-center justify-center rounded-md border border-[#cdd5ea] text-[#234FAA] hover:bg-[#234FAA] hover:text-white transition">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <img src="/page/image/logo.png" alt="CCTV AMC Manager Logo" class="w-22 h-12">
            </div>
            <div class="relative">
                <button id="profileBtn" class="flex items-center gap-2.5 p-1.5 transition">
                    <div class="w-[34px] h-[34px] rounded-full flex items-center justify-center font-mono text-[12px] font-semibold text-white" style="background: linear-gradient(135deg, #1A328D, #234FAA);">VJ</div>
                    <div class="hidden sm:block text-left">
                        <div class="text-[13px] font-semibold text-[#1A328D]">Vikram Joshi</div>
                        <div class="text-[11px] text-[#7b85a3]">Senior Engineer</div>
                    </div>
                    <svg class="w-4 h-4 text-[#1A328D]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div id="profileDropdown" class="dropdown-menu absolute right-0 mt-2 w-56 bg-white border border-[#cdd5ea] rounded-lg shadow-lg overflow-hidden z-50">
                    <div class="px-4 py-3 border-b border-[#e1e6f3]">
                        <div class="text-[13px] font-semibold text-[#1A328D]">Vikram Joshi</div>
                        <div class="text-[11px] text-[#7b85a3]">vikram@cctvmanager.com</div>
                    </div>
                    <div class="border-t border-[#e1e6f3] py-1">
                        <button id="logoutBtn" class="flex items-center gap-3 w-full px-4 py-2.5 text-[13px] text-red-600 hover:bg-red-50 transition"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex min-h-screen" style="background-color: #F0F3FB;">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar border-r border-[#e1e6f3] flex flex-col h-screen sticky top-0 overflow-y-auto">
            <nav class="flex flex-col gap-0.5 flex-1 overflow-y-auto mt-2">
                <a href="/page/dashboard.html" class="flex items-center gap-4 px-3 py-2.5 rounded-md text-[13.5px] font-medium text-[#1A328D] hover:bg-[#1A328D] hover:text-white transition sidebar-nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                    <span class="sidebar-nav-text">Dashboard</span>
                </a>
                <a href="/page/company-management.html" class="flex items-center gap-4 px-3 py-2.5 rounded-md text-[13.5px] font-medium text-[#1A328D] hover:bg-[#1A328D] hover:text-white transition sidebar-nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
                    <span class="sidebar-nav-text">Company Management</span>
                </a>
                <a href="/inspection-form.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-[13.5px] font-medium text-[#1A328D] hover:bg-[#1A328D] hover:text-white transition sidebar-nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    <span class="sidebar-nav-text">Monthly Visits</span>
                </a>
                <a href="/page/reports.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-[13.5px] font-medium bg-[#1A328D] text-white transition sidebar-nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                    <span class="sidebar-nav-text">Monthly Inspection Reports</span>
                </a>
                <a href="/page/staff-management.html" class="mt-2 flex items-center gap-3 px-3 py-2.5 rounded-md text-[13.5px] font-medium text-[#1A328D] hover:bg-[#1A328D] hover:text-white transition sidebar-nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span class="sidebar-nav-text">Staff Management</span>
                </a>
            </nav>
        </aside>

        <div id="overlay" class="hidden fixed inset-0 bg-black/50 z-[35]"></div>

        <!-- MAIN -->
        <main class="flex-1 px-4 md:px-9 pt-5 md:pt-8 pb-16 max-w-[1400px]">
            <div class="flex flex-col md:flex-row md:items-start justify-between gap-5 mb-7">
                <div>
                    <h1 class="font-display font-semibold text-lg tracking-tight m-0 mb-1.5 text-[#1A328D]">Reports</h1>
                    <p class="text-[#7b85a3] text-sm mt-1">View and manage inspection reports &amp; issues</p>
                </div>
            </div>

            <div class="flex flex-wrap border-b border-bordersoft mb-6">
                <button class="tab-btn active" data-tab="reports"><i class="fa-regular fa-calendar-check mr-2"></i>Monthly Inspection Reports</button>
                <button class="tab-btn" data-tab="issues"><i class="fa-regular fa-circle mr-2"></i>Issues Report</button>
            </div>

            <!-- TAB: REPORTS -->
            <div id="tab-reports" class="tab-content active">
                <div class="filter-bar mb-4">
                    <div class="relative flex-1 w-full">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-[#7b85a3] text-sm"></i>
                        <input type="text" id="searchReport" placeholder="Search by company, engineer, department..." class="w-full pl-10 pr-3.5 py-2 border border-[#cdd5ea] rounded-md text-[#1A328D] bg-white focus:outline-none">
                    </div>
                    <select id="filterApprove" class="border border-[#cdd5ea] text-[#1A328D] rounded-md px-3 py-2 text-sm bg-white">
                        <option value="">All Status</option>
                        <option value="Approved">Fully Approved</option>
                        <option value="Pending">Has Pending</option>
                    </select>
                    <select id="filterCompany" class="border border-[#cdd5ea] text-[#1A328D] rounded-md px-3 py-2 text-sm bg-white">
                        <option value="">All Companies</option>
                    </select>
                    <button id="resetReportFilters" class="btn-reset whitespace-nowrap"><i class="fa-solid fa-rotate-right"></i> Reset</button>
                </div>
                <div id="reportsContainer"></div>
            </div>

            <!-- TAB: ISSUES -->
            <div id="tab-issues" class="tab-content">
                <div class="filter-bar mb-4">
                    <div class="relative flex-1 w-full">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-[#7b85a3] text-sm"></i>
                        <input type="text" id="searchIssues" placeholder="Search by company, camera..." class="w-full pl-10 pr-3.5 py-2 border border-[#cdd5ea] rounded-md text-[#1A328D] bg-white focus:outline-none">
                    </div>
                    <select id="filterIssueStatus" class="border border-[#cdd5ea] text-[#1A328D] rounded-md px-3 py-2 text-sm bg-white">
                        <option value="">All Status</option>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                        <option value="Closed">Closed</option>
                    </select>
                    <button id="resetIssueFilters" class="btn-reset whitespace-nowrap"><i class="fa-solid fa-rotate-right"></i> Reset</button>
                </div>
                <div id="issuesContainer"></div>
            </div>
        </main>
    </div>

    <div id="toastMessage" class="toast"></div>

    <!-- VIEW REPORT MODAL (with camera table) -->
    <div id="viewReportModal" class="modal-backdrop">
        <div class="modal modal-card" style="max-width:800px;">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-display font-bold text-lg text-[#1A328D]"><i class="fa-regular fa-eye mr-2"></i>Report Details</h3>
                <button id="closeViewReport" class="w-8 h-8 flex items-center justify-center rounded-full border border-[#cdd5ea] text-[#1A328D] hover:bg-[#1A328D] hover:text-white transition">✕</button>
            </div>
            <div id="viewReportContent"></div>
        </div>
    </div>

    <!-- EDIT REPORT MODAL -->
    <div id="editReportModal" class="modal-backdrop">
        <div class="modal modal-card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-display font-bold text-lg text-[#1A328D]"><i class="fa-regular fa-pen-to-square mr-2"></i>Edit Report</h3>
                <button id="closeEditReport" class="w-8 h-8 flex items-center justify-center rounded-full border border-[#cdd5ea] text-[#1A328D] hover:bg-[#1A328D] hover:text-white transition">✕</button>
            </div>
            <form id="editReportForm">
                <input type="hidden" id="editReportId">
                <input type="hidden" id="editReportType" value="report">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">

    <script>
    (function() {
        'use strict';

        // ===== STORAGE KEYS (same as monthly-inspection.html) =====
        const REPORTS_KEY = 'cctv_amc_reports';
        const ISSUES_KEY = 'cctv_amc_issues';

        // ===== MOCK DATA =====
        // Note: "Shree Balaji Enterprises" has TWO visits in January 2026 done by
        // two different engineers for two different departments — this is the
        // exact scenario the combined monthly report needs to handle correctly.
        const mockReports = [
            { id: 1, company: "Shree Balaji Enterprises", department: "Security", date: "2026-01-10", engineer: "Vikram Joshi", vendor: "CP Plus", bsid_pic: "Rajesh", total: 6, working: 6, faulty: 0, remarks: "All cameras working fine", approved: true, approved_by: "Rajesh Sharma", approved_date: "2026-01-11",
              signature: null,
              cameraDetails: [
                { sr_no:1, camera_name:'CAM001', location:'Reception 1', dept:'Security', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
                { sr_no:2, camera_name:'CAM002', location:'Reception 2', dept:'Security', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
                { sr_no:3, camera_name:'CAM003', location:'Parking 1', dept:'Security', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
                { sr_no:4, camera_name:'CAM004', location:'Parking 2', dept:'Security', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
                { sr_no:5, camera_name:'CAM005', location:'Server Room', dept:'Security', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
                { sr_no:6, camera_name:'CAM006', location:'Warehouse', dept:'Security', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
              ]
            },
            { id: 2, company: "Shree Balaji Enterprises", department: "IT & Data Center", date: "2026-01-25", engineer: "Suresh Rana", vendor: "CP Plus", bsid_pic: "Meena", total: 4, working: 3, faulty: 1, remarks: "Camera 2 needs replacement", approved: false, approved_by: null, approved_date: null,
              signature: null,
              cameraDetails: [
                { sr_no:1, camera_name:'CAM101', location:'Server Rack 1', dept:'IT', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
                { sr_no:2, camera_name:'CAM102', location:'Server Rack 2', dept:'IT', working:'No', lens_cleaning:'Pending', visual_on_tv:'No', focus_angle:'Adjustment Required', damage:'Lens cracked', abnormality:'Camera not powering on' },
                { sr_no:3, camera_name:'CAM103', location:'UPS Room', dept:'IT', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
                { sr_no:4, camera_name:'CAM104', location:'IT Entry', dept:'IT', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
              ]
            },
            { id: 3, company: "Patil Traders", department: "Security", date: "2026-01-20", engineer: "Vikram Joshi", vendor: "Hikvision", bsid_pic: "Sunil", total: 4, working: 4, faulty: 0, remarks: "All good", approved: true, approved_by: "Sunil Patil", approved_date: "2026-01-21",
              signature: null,
              cameraDetails: [
                { sr_no:1, camera_name:'CAM001', location:'Cabin 1', dept:'Security', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
                { sr_no:2, camera_name:'CAM002', location:'Cabin 2', dept:'Security', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
                { sr_no:3, camera_name:'CAM003', location:'Reception 1', dept:'Security', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
                { sr_no:4, camera_name:'CAM004', location:'Parking 1', dept:'Security', working:'Yes', lens_cleaning:'Done', visual_on_tv:'Yes', focus_angle:'Correct', damage:'', abnormality:'' },
              ]
            },
        ];

        const mockIssues = [
            { id: 1, company: "Shree Balaji Enterprises", camera: "CAM002", type: "Hardware", priority: "High", status: "Resolved", desc: "Camera not powering on", created: "2026-02-12", resolvedBy: "Vikram Joshi", resolvedDate: "2026-02-14", approved: true, approved_by: "Rajesh Sharma", approved_date: "2026-02-15", dept: "Security", location: "Reception 2", resolution: "Replaced power supply" },
            { id: 2, company: "Patil Traders", camera: "CAM005", type: "Network", priority: "Critical", status: "Resolved", desc: "Camera offline - network issue", created: "2026-02-22", resolvedBy: "Suresh Patil", resolvedDate: "2026-02-24", approved: true, approved_by: "Sunil Patil", approved_date: "2026-02-25", dept: "Security", location: "Parking", resolution: "Fixed network switch" },
            { id: 3, company: "Shree Balaji Enterprises", camera: "CAM001", type: "Software", priority: "Medium", status: "Open", desc: "Firmware update needed", created: "2026-03-18", resolvedBy: null, resolvedDate: null, approved: false, approved_by: null, approved_date: null, dept: "Security", location: "Reception 1", resolution: "" },
        ];

        // Load from localStorage, fall back to mock
        function loadReports() {
            const saved = JSON.parse(localStorage.getItem(REPORTS_KEY) || 'null');
            return saved && saved.length > 0 ? saved : mockReports;
        }
        function loadIssues() {
            const saved = JSON.parse(localStorage.getItem(ISSUES_KEY) || 'null');
            return saved && saved.length > 0 ? saved : mockIssues;
        }

        let reports = loadReports();
        let issues = loadIssues();

        function saveReports() { localStorage.setItem(REPORTS_KEY, JSON.stringify(reports)); }
        function saveIssues() { localStorage.setItem(ISSUES_KEY, JSON.stringify(issues)); }

        let deleteId = null, deleteType = null;
        const reportsContainer = document.getElementById('reportsContainer');
        const issuesContainer = document.getElementById('issuesContainer');

        function showToast(msg, danger) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = msg;
            toast.className = 'toast' + (danger ? ' toast-danger' : '') + ' show';
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 2600);
        }

        function monthYearOf(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
        }

        function groupByMonth(data, dateKey) {
            const groups = {};
            data.forEach(item => {
                const monthYear = monthYearOf(item[dateKey]);
                if (!groups[monthYear]) groups[monthYear] = [];
                groups[monthYear].push(item);
            });
            return Object.fromEntries(
                Object.entries(groups).sort((a, b) => new Date(b[0]+' 1') - new Date(a[0]+' 1'))
            );
        }

        // Groups visits by company WITHIN a month bucket, so a company with
        // multiple department-visits (possibly by different engineers) in the
        // same month is shown — and exported — as ONE combined monthly report.
        function groupByCompany(monthVisits) {
            const groups = {};
            monthVisits.forEach(v => {
                if (!groups[v.company]) groups[v.company] = [];
                groups[v.company].push(v);
            });
            Object.values(groups).forEach(list => list.sort((a, b) => new Date(a.date) - new Date(b.date)));
            return groups;
        }

        // ===== RENDER REPORTS (grouped by Month -> Company, showing every engineer) =====
        function renderReports() {
            const search = document.getElementById('searchReport').value.toLowerCase();
            const filterApprove = document.getElementById('filterApprove').value;
            const filterCompany = document.getElementById('filterCompany').value;

            const filtered = reports.filter(r => {
                const matchSearch = r.company.toLowerCase().includes(search)
                    || (r.engineer||'').toLowerCase().includes(search)
                    || (r.department||'').toLowerCase().includes(search);
                const matchCompany = !filterCompany || r.company === filterCompany;
                return matchSearch && matchCompany;
            });

            // Update company filter dropdown
            const compFilter = document.getElementById('filterCompany');
            const companies = [...new Set(reports.map(r => r.company))];
            const prevCompanyVal = compFilter.value;
            compFilter.innerHTML = '<option value="">All Companies</option>' + companies.map(c => `<option value="${c}">${c}</option>`).join('');
            compFilter.value = prevCompanyVal;

            const groupedByMonth = groupByMonth(filtered, 'date');
            let html = '';

            if (!Object.keys(groupedByMonth).length) {
                html = '<div class="text-center py-16 px-6"><div class="text-4xl text-[#cdd5ea] mb-3"><i class="fa-regular fa-file-lines"></i></div><p class="font-semibold text-[#1A328D]">No reports found</p><p class="text-sm text-[#7b85a3] mt-1">Submit an inspection from Monthly Visits page</p></div>';
            } else {
                Object.entries(groupedByMonth).forEach(([month, visitsInMonth]) => {
                    const byCompany = groupByCompany(visitsInMonth);
                    const companyKeys = Object.keys(byCompany);

                    // filterApprove applies at the combined-company level
                    const visibleCompanyKeys = companyKeys.filter(company => {
                        if (!filterApprove) return true;
                        const allApproved = byCompany[company].every(v => v.approved);
                        return filterApprove === 'Approved' ? allApproved : !allApproved;
                    });

                    if (!visibleCompanyKeys.length) return;

                    html += `<div class="month-group"><div class="month-title"><i class="fa-regular fa-calendar-check text-accenttext"></i>${month}<span class="count-badge">${visibleCompanyKeys.length} ${visibleCompanyKeys.length > 1 ? 'companies' : 'company'}</span></div><div class="grid grid-cols-1 gap-3">`;

                    visibleCompanyKeys.forEach(company => {
                        const visits = byCompany[company];
                        const engineers = [...new Set(visits.map(v => v.engineer).filter(Boolean))];
                        const totalCams = visits.reduce((s, v) => s + Number(v.total || 0), 0);
                        const totalWorking = visits.reduce((s, v) => s + Number(v.working || 0), 0);
                        const totalFaulty = visits.reduce((s, v) => s + Number(v.faulty || 0), 0);
                        const allApproved = visits.every(v => v.approved);
                        const pendingCount = visits.filter(v => !v.approved).length;
                        const statusChip = totalFaulty === 0 ? 'chip-active' : 'chip-soon';
                        const statusLabel = totalFaulty === 0 ? 'All Working' : `${totalFaulty} Faulty`;
                        const approveChip = allApproved ? 'chip-approved' : 'chip-pending';
                        const approveLabel = allApproved ? '<i class="fa-solid fa-check"></i> All Approved' : `${pendingCount} Pending`;
                        const companyKeySafe = company.replace(/'/g, "\\'");

                        html += `<div class="report-card">
                            <div class="flex flex-wrap justify-between items-start gap-2">
                                <div>
                                    <div class="font-semibold text-[#1A328D] text-lg">${company}</div>
                                    <div class="flex flex-wrap gap-2 mt-1.5">
                                        ${engineers.map(e => `<span class="chip chip-engineer"><i class="fa-regular fa-user mr-1"></i>${e}</span>`).join('')}
                                    </div>
                                    <div class="text-xs text-[#7b85a3] mt-1.5"><i class="fa-regular fa-building mr-1"></i>${visits.length} department visit${visits.length > 1 ? 's' : ''} logged this month</div>
                                </div>
                                <div class="flex flex-wrap gap-2 items-center">
                                    <span class="chip ${statusChip}">${statusLabel}</span>
                                    <span class="chip ${approveChip}">${approveLabel}</span>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-4 text-sm text-[#3d4763] mt-2">
                                <span>Total: <b>${totalCams}</b></span>
                                <span class="text-accenttext"><i class="fa-regular fa-circle-check mr-1"></i>Working: <b>${totalWorking}</b></span>
                                ${totalFaulty > 0 ? `<span class="text-redc"><i class="fa-regular fa-circle-xmark mr-1"></i>Faulty: <b>${totalFaulty}</b></span>` : ''}
                            </div>

                            <div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-bordersoft">
                                <button class="btn-export-excel text-xs py-1.5 px-3" onclick="exportCompanyMonthlyExcel('${companyKeySafe}','${month}')"><i class="fa-regular fa-file-excel mr-1"></i>Export Combined Excel</button>
                            </div>

                            <div class="mt-3 pt-3 border-t border-bordersoft space-y-2">
                                ${visits.map(r => renderVisitRow(r)).join('')}
                            </div>
                        </div>`;
                    });

                    html += '</div></div>';
                });

                if (!html) {
                    html = '<div class="text-center py-16 px-6"><div class="text-4xl text-[#cdd5ea] mb-3"><i class="fa-regular fa-file-lines"></i></div><p class="font-semibold text-[#1A328D]">No reports found</p></div>';
                }
            }
            reportsContainer.innerHTML = html;
        }

        function renderVisitRow(r) {
            const date = new Date(r.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            const approveCls = r.approved ? 'chip-approved' : 'chip-pending';
            const approveLabel = r.approved ? '<i class="fa-solid fa-check"></i> Approved' : 'Pending';
            const sig = r.signature
                ? `<img src="${r.signature}" class="sig-thumb" alt="signature of ${r.engineer}">`
                : `<span class="no-sig-badge"><i class="fa-solid fa-triangle-exclamation mr-1"></i>No signature</span>`;
            return `<div class="visit-row">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex flex-wrap items-center gap-2 text-sm">
                        <span class="font-semibold text-[#1A328D]"><i class="fa-solid fa-diagram-project mr-1"></i>${r.department || '—'}</span>
                        <span class="text-[#7b85a3]">·</span>
                        <span><i class="fa-regular fa-user mr-1"></i>${r.engineer || '—'}</span>
                        <span class="text-[#7b85a3]">·</span>
                        <span><i class="fa-regular fa-calendar mr-1"></i>${date}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="chip ${approveCls}">${approveLabel}</span>
                    </div>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2 mt-2">
                    <div class="flex flex-wrap gap-3 text-xs text-[#3d4763]">
                        <span>Total: <b>${r.total}</b></span>
                        <span class="text-accenttext">Working: <b>${r.working}</b></span>
                        ${r.faulty > 0 ? `<span class="text-redc">Faulty: <b>${r.faulty}</b></span>` : ''}
                        ${r.approved ? `<span class="text-[#7b85a3]">Approved by ${r.approved_by} on ${r.approved_date}</span>` : ''}
                    </div>
                    ${sig}
                </div>
                <div class="flex flex-wrap gap-2 mt-2.5 actions">
                    <button class="btn-approve ${r.approved ? 'approved' : ''}" onclick="toggleApprove(${r.id},'report')" ${r.approved ? 'disabled' : ''}><i class="fa-regular ${r.approved ? 'fa-circle-check' : 'fa-thumbs-up'}"></i>${r.approved ? 'Approved' : 'Approve'}</button>
                    <button class="text-[#1A328D] text-sm px-3 py-1 border border-[#cdd5ea] rounded-md hover:bg-[#eef1fa] transition" onclick="viewReport(${r.id},'report')"><i class="fa-regular fa-eye mr-1"></i>View</button>
                    <button class="text-[#1A328D] text-sm px-3 py-1 border border-[#cdd5ea] rounded-md hover:bg-[#eef1fa] transition" onclick="editReport(${r.id},'report')"><i class="fa-regular fa-pen-to-square mr-1"></i>Edit</button>
                    <button class="text-redc text-sm px-3 py-1 border border-[#cdd5ea] rounded-md hover:bg-red-50 transition" onclick="deleteReport(${r.id},'report')"><i class="fa-regular fa-trash-can mr-1"></i>Delete</button>
                </div>
            </div>`;
        }

        // ===== RENDER ISSUES =====
        function renderIssues() {
            const search = document.getElementById('searchIssues').value.toLowerCase();
            const filterStatus = document.getElementById('filterIssueStatus').value;
            const filtered = issues.filter(r => {
                const matchSearch = (r.company||'').toLowerCase().includes(search) || (r.camera||'').toLowerCase().includes(search);
                const matchStatus = !filterStatus || r.status === filterStatus;
                return matchSearch && matchStatus;
            });
            const grouped = groupByMonth(filtered, 'created');
            let html = '';
            if (!Object.keys(grouped).length) {
                html = '<div class="text-center py-16 px-6"><div class="text-4xl text-[#cdd5ea] mb-3"><i class="fa-regular fa-circle-exclamation"></i></div><p class="font-semibold text-[#1A328D]">No issues found</p></div>';
            } else {
                Object.entries(grouped).forEach(([month, records]) => {
                    html += `<div class="month-group"><div class="month-title">${month}<span class="count-badge">${records.length} ${records.length > 1 ? 'issues' : 'issue'}</span></div><div class="grid grid-cols-1 gap-3">`;
                    records.forEach(r => {
                        const statusCls = r.status === 'Resolved' ? 'chip-resolved' : r.status === 'Open' ? 'chip-open' : r.status === 'In Progress' ? 'chip-progress' : 'chip-closed';
                        const priorityCls = r.priority === 'Critical' ? 'text-redc font-bold' : r.priority === 'High' ? 'text-amber font-bold' : 'text-[#3d4763]';
                        const createdDate = new Date(r.created).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
                        const resolvedDate = r.resolvedDate ? new Date(r.resolvedDate).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : null;
                        const approveCls = r.approved ? 'chip-approved' : 'chip-pending';
                        const approveLabel = r.approved ? '<i class="fa-solid fa-check"></i> Approved' : 'Pending';
                        html += `<div class="issue-card-r ${r.status === 'Resolved' ? 'resolved' : ''}">
                            <div class="flex flex-wrap justify-between items-start gap-2">
                                <div>
                                    <div class="font-semibold text-[#1A328D] text-lg">${r.company}</div>
                                    <div class="flex flex-wrap gap-3 text-xs text-[#7b85a3] mt-1">
                                        <span><i class="fa-regular fa-video mr-1"></i>${r.camera}</span>
                                        <span><i class="fa-regular fa-calendar mr-1"></i>${createdDate}</span>
                                    </div>
                                </div>
                                <div class="flex flex-wrap gap-2">
                                    <span class="chip ${statusCls}">${r.status}</span>
                                    <span class="chip ${approveCls}">${approveLabel}</span>
                                </div>
                            </div>
                            <div class="text-sm mt-1">${r.desc}</div>
                            <div class="flex flex-wrap gap-2 text-xs text-[#3d4763] mt-1.5">
                                <span class="${priorityCls}"><i class="fa-regular fa-flag mr-1"></i>${r.priority}</span>
                                <span><i class="fa-regular fa-tag mr-1"></i>${r.type}</span>
                                ${resolvedDate ? `<span class="text-accenttext"><i class="fa-regular fa-circle-check mr-1"></i>${resolvedDate}</span>` : ''}
                            </div>
                            ${r.resolvedBy ? `<div class="text-xs text-[#7b85a3] mt-1"><i class="fa-regular fa-user mr-1"></i>Resolved by: ${r.resolvedBy}</div>` : ''}
                            ${r.approved ? `<div class="text-xs text-[#7b85a3] mt-1"><i class="fa-regular fa-id-badge mr-1"></i>Approved by: ${r.approved_by} on ${r.approved_date}</div>` : ''}
                            <div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-bordersoft actions">
                                <button class="btn-export-issue-excel text-xs py-1.5 px-3" onclick="exportIssueExcel(${r.id})"><i class="fa-regular fa-file-excel mr-1"></i>Export Excel</button>
                                <button class="btn-approve ${r.approved ? 'approved' : ''}" onclick="toggleApprove(${r.id},'issue')" ${r.approved ? 'disabled' : ''}><i class="fa-regular ${r.approved ? 'fa-circle-check' : 'fa-thumbs-up'}"></i>${r.approved ? 'Approved' : 'Approve'}</button>
                                <button class="text-[#1A328D] text-sm px-3 py-1 border border-[#cdd5ea] rounded-md hover:bg-[#eef1fa] transition" onclick="viewReport(${r.id},'issue')"><i class="fa-regular fa-eye mr-1"></i>View</button>
                                <button class="text-redc text-sm px-3 py-1 border border-[#cdd5ea] rounded-md hover:bg-red-50 transition" onclick="deleteReport(${r.id},'issue')"><i class="fa-regular fa-trash-can mr-1"></i>Delete</button>
                            </div>
                        </div>`;
                    });
                    html += '</div></div>';
                });
            }
            issuesContainer.innerHTML = html;
        }

        // ===== EXPORT COMBINED COMPANY+MONTH EXCEL (with per-visit engineer & signature) =====
        window.exportCompanyMonthlyExcel = async function(company, monthYear) {
            const visits = reports
                .filter(r => r.company === company && monthYearOf(r.date) === monthYear)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            if (!visits.length) { showToast('Nothing to export', true); return; }

            const btn = event.currentTarget;
            const originalLabel = btn ? btn.innerHTML : null;
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Exporting...'; }

            try {
                const wb = new ExcelJS.Workbook();
                const ws = wb.addWorksheet('Monthly Checksheet');
                ws.columns = [
                    { width: 7 }, { width: 16 }, { width: 18 }, { width: 12 },
                    { width: 14 }, { width: 12 }, { width: 20 }, { width: 18 }, { width: 22 }
                ];

                let row = 1;
                ws.mergeCells(`A${row}:I${row}`);
                const titleCell = ws.getCell(`A${row}`);
                titleCell.value = `Monthly Camera Checksheet — ${company} — ${monthYear}`;
                titleCell.font = { bold: true, size: 14, color: { argb: 'FF1A328D' } };
                row += 1;
                ws.mergeCells(`A${row}:I${row}`);
                ws.getCell(`A${row}`).value = `${visits.length} department visit${visits.length > 1 ? 's' : ''} logged this month`;
                ws.getCell(`A${row}`).font = { italic: true, size: 10, color: { argb: 'FF7B85A3' } };
                row += 2;

                for (const visit of visits) {
                    // Department / engineer / date sub-header
                    ws.mergeCells(`A${row}:I${row}`);
                    const subCell = ws.getCell(`A${row}`);
                    subCell.value = `Department: ${visit.department || '-'}   |   Date: ${visit.date}   |   Vendor: ${visit.vendor || '-'}   |   BSID PIC: ${visit.bsid_pic || '-'}`;
                    subCell.font = { bold: true, color: { argb: 'FF1A328D' } };
                    subCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8ECF7' } };
                    row += 1;

                    // Camera table header
                    const headerRow = ws.getRow(row);
                    const headers = ['Sr.No', 'Camera Name', 'Location', 'Working', 'Lens Cleaning', 'Visual on TV', 'Focus Angle', 'Damage', 'Any Abnormality'];
                    headers.forEach((h, i) => { headerRow.getCell(i + 1).value = h; headerRow.getCell(i + 1).font = { bold: true }; headerRow.getCell(i + 1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F3FB' } }; });
                    row += 1;

                    const cameras = visit.cameraDetails || [];
                    cameras.forEach((c, idx) => {
                        const r = ws.getRow(row);
                        r.getCell(1).value = c.sr_no || (idx + 1);
                        r.getCell(2).value = c.camera_name || '';
                        r.getCell(3).value = c.location || c.camera_type || '';
                        r.getCell(4).value = c.working || '';
                        r.getCell(5).value = c.lens_cleaning || '';
                        r.getCell(6).value = c.visual_on_tv || '';
                        r.getCell(7).value = c.focus_angle || '';
                        r.getCell(8).value = c.damage || '';
                        r.getCell(9).value = c.abnormality || '';
                        row += 1;
                    });

                    row += 1; // spacer

                    // Checked-by row + embedded signature image next to the engineer name
                    const checkedRow = ws.getRow(row);
                    checkedRow.getCell(1).value = 'Checked by:';
                    checkedRow.getCell(1).font = { bold: true };
                    checkedRow.getCell(2).value = visit.engineer || '-';
                    checkedRow.getCell(2).font = { bold: true, color: { argb: 'FF1A328D' } };

                    ws.getRow(row).height = 34;

                    if (visit.signature) {
                        try {
                            const base64 = visit.signature.split(',')[1];
                            const imgId = wb.addImage({ base64, extension: 'png' });
                            // anchor image in the cell right next to the engineer's name (column D, 0-indexed col 3)
                            ws.addImage(imgId, {
                                tl: { col: 3, row: row - 1 },
                                ext: { width: 100, height: 32 }
                            });
                        } catch (imgErr) {
                            checkedRow.getCell(5).value = '(signature unavailable)';
                        }
                    } else {
                        checkedRow.getCell(5).value = 'No signature on file';
                        checkedRow.getCell(5).font = { italic: true, color: { argb: 'FFC0392B' } };
                    }

                    row += 3; // room for the signature image height + spacing before next visit block
                }

                // Final sign-off block
                row += 1;
                ws.mergeCells(`A${row}:C${row}`); ws.getCell(`A${row}`).value = 'BSID PIC';
                ws.mergeCells(`E${row}:F${row}`); ws.getCell(`E${row}`).value = 'Area Manager';
                ws.mergeCells(`H${row}:I${row}`); ws.getCell(`H${row}`).value = 'Manager';
                ws.getRow(row).font = { bold: true };

                const buffer = await wb.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const fileName = `${company}_${monthYear.replace(/\s+/g, '_')}.xlsx`;
                a.href = url; a.download = fileName; document.body.appendChild(a); a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`Combined Excel exported: ${fileName}`);
            } catch (err) {
                showToast('Error: ' + err.message, true);
            } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = originalLabel; }
            }
        };

        // ===== EXPORT ISSUE EXCEL (Separate Format, unchanged) =====
        window.exportIssueExcel = function(id) {
            const iss = issues.find(x => x.id === id);
            if (!iss) return;

            const date = new Date(iss.created);
            const monthName = date.toLocaleString('en-US', { month: 'long' });
            const year = date.getFullYear();
            const fileName = `Issue_${iss.company}_${monthName}_${year}.xlsx`;

            const sameMonthIssues = issues.filter(i => {
                const d = new Date(i.created);
                return i.company === iss.company && d.getMonth() === date.getMonth() && d.getFullYear() === date.getFullYear();
            });

            const excelData = [
                ['Issues Report', '', '', '', '', '', '', '', '', '', ''],
                ['Company', iss.company, '', '', '', '', '', '', '', '', ''],
                ['Month / Year', `${monthName} ${year}`, '', '', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', '', '', '', ''],
                ['Sr.No', 'Company', 'Camera', 'Location', 'Issue Type', 'Priority', 'Status', 'Description', 'Created Date', 'Resolved Date', 'Resolved By', 'Resolution', 'Approved'],
            ];

            sameMonthIssues.forEach((i, idx) => {
                excelData.push([
                    idx + 1,
                    i.company || '',
                    i.camera || '',
                    i.location || '',
                    i.type || '',
                    i.priority || '',
                    i.status || '',
                    i.desc || '',
                    i.created || '',
                    i.resolvedDate || '',
                    i.resolvedBy || '',
                    i.resolution || '',
                    i.approved ? 'Yes' : 'No'
                ]);
            });

            const total = sameMonthIssues.length;
            const resolved = sameMonthIssues.filter(i => i.status === 'Resolved').length;
            const open = sameMonthIssues.filter(i => i.status === 'Open').length;
            const inProgress = sameMonthIssues.filter(i => i.status === 'In Progress').length;

            excelData.push(['', '', '', '', '', '', '', '', '', '', '', '', '']);
            excelData.push(['Summary', '', '', '', '', '', '', '', '', '', '', '', '']);
            excelData.push(['Total Issues', total, '', '', '', '', '', '', '', '', '', '', '']);
            excelData.push(['Resolved', resolved, '', '', '', '', '', '', '', '', '', '', '']);
            excelData.push(['Open', open, '', '', '', '', '', '', '', '', '', '', '']);
            excelData.push(['In Progress', inProgress, '', '', '', '', '', '', '', '', '', '', '']);

            try {
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(excelData);
                ws['!cols'] = [
                    { wch: 6 }, { wch: 22 }, { wch: 10 }, { wch: 18 }, { wch: 14 },
                    { wch: 12 }, { wch: 14 }, { wch: 35 }, { wch: 14 }, { wch: 14 },
                    { wch: 16 }, { wch: 25 }, { wch: 10 }
                ];
                XLSX.utils.book_append_sheet(wb, ws, 'Issues Report');
                XLSX.writeFile(wb, fileName);
                showToast(`Issue Excel exported: ${fileName}`);
            } catch (err) {
                showToast('Error: ' + err.message, true);
            }
        };

        // ===== VIEW REPORT (with camera table + signature) =====
        window.viewReport = function(id, type) {
            const item = type === 'report' ? reports.find(r => r.id === id) : issues.find(r => r.id === id);
            if (!item) return;
            const date = new Date(item.date || item.created).toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' });
            let html = '';

            if (type === 'report') {
                const cameras = item.cameraDetails || [];
                html = `
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">
                        <div><div class="text-xs text-[#7b85a3]">Company</div><div class="font-semibold text-[#1A328D]">${item.company}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Department</div><div class="font-semibold text-[#1A328D]">${item.department||'—'}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Date</div><div class="font-semibold text-[#1A328D]">${date}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Engineer</div><div class="font-semibold text-[#1A328D]">${item.engineer||''}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Vendor</div><div class="font-semibold text-[#1A328D]">${item.vendor||'—'}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">BSID PIC</div><div class="font-semibold text-[#1A328D]">${item.bsid_pic||'—'}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Total Cameras</div><div class="font-semibold text-[#1A328D]">${item.total}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Working</div><div class="font-semibold text-accenttext">${item.working}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Faulty</div><div class="font-semibold text-redc">${item.faulty}</div></div>
                    </div>
                    ${item.remarks ? `<div class="text-sm text-[#7b85a3] mb-4 italic p-3 bg-[#eef1fa] rounded-lg">${item.remarks}</div>` : ''}
                    ${item.approved ? `<div class="text-xs text-[#7b85a3] mb-4"><i class="fa-solid fa-check mr-1"></i>Approved by <b>${item.approved_by}</b> on ${item.approved_date}</div>` : ''}

                    <div class="flex items-center justify-between mb-3">
                        <div class="text-sm font-semibold text-[#1A328D]"><i class="fa-solid fa-video mr-1 text-accenttext"></i>Camera Details (${cameras.length} cameras)</div>
                        ${item.signature
                            ? `<div class="flex items-center gap-2"><span class="text-xs text-[#7b85a3]">Engineer signature:</span><img src="${item.signature}" class="sig-thumb" style="height:36px;max-width:120px;"></div>`
                            : `<span class="no-sig-badge">No signature on file</span>`}
                    </div>
                    <div class="overflow-x-auto">
                        <table class="cam-table">
                            <thead>
                                <tr>
                                    <th>Sr</th>
                                    <th>Camera Name</th>
                                    <th>Working</th>
                                    <th>Lens Clean</th>
                                    <th>Visual TV</th>
                                    <th>Focus</th>
                                    <th>Damage</th>
                                    <th>Abnormality</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${cameras.map(c => `
                                    <tr>
                                        <td>${c.sr_no}</td>
                                        <td class="font-mono">${c.camera_name}</td>
                                        <td class="${c.working === 'Yes' ? 'td-working-yes' : 'td-working-no'}">${c.working}</td>
                                        <td>${c.lens_cleaning||''}</td>
                                        <td>${c.visual_on_tv||''}</td>
                                        <td>${c.focus_angle||''}</td>
                                        <td>${c.damage||''}</td>
                                        <td>${c.abnormality||''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div class="flex justify-end mt-5 gap-2">
                        <button onclick="exportCompanyMonthlyExcel('${item.company.replace(/'/g,"\\'")}','${monthYearOf(item.date)}')" class="btn-export-excel px-4 py-2 text-sm"><i class="fa-regular fa-file-excel mr-1"></i>Export Combined Excel</button>
                        <button onclick="document.getElementById('viewReportModal').classList.remove('open')" class="btn-primary px-6 py-2">Close</button>
                    </div>
                `;
            } else {
                const statusCls = item.status==='Resolved' ? 'chip-resolved' : item.status==='Open' ? 'chip-open' : item.status==='In Progress' ? 'chip-progress' : 'chip-closed';
                html = `
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div><div class="text-xs text-[#7b85a3]">Company</div><div class="font-semibold">${item.company}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Camera</div><div class="font-mono font-semibold">${item.camera}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Status</div><div><span class="chip ${statusCls}">${item.status}</span></div></div>
                        <div><div class="text-xs text-[#7b85a3]">Priority</div><div class="font-semibold">${item.priority}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Type</div><div>${item.type}</div></div>
                        <div><div class="text-xs text-[#7b85a3]">Created</div><div>${date}</div></div>
                        ${item.resolvedDate ? `<div><div class="text-xs text-[#7b85a3]">Resolved</div><div class="text-accenttext">${new Date(item.resolvedDate).toLocaleDateString('en-IN')}</div></div>` : ''}
                        ${item.resolvedBy ? `<div><div class="text-xs text-[#7b85a3]">Resolved By</div><div>${item.resolvedBy}</div></div>` : ''}
                    </div>
                    <div class="text-sm text-[#1A328D] p-3 bg-[#eef1fa] rounded-lg mb-3">${item.desc}</div>
                    ${item.resolution ? `<div class="text-sm text-accenttext p-3 bg-[#e3f6ea] rounded-lg mb-3"><i class="fa-solid fa-check mr-1"></i>${item.resolution}</div>` : ''}
                    <div class="flex justify-end gap-2 mt-4">
                        <button onclick="exportIssueExcel(${item.id})" class="btn-export-issue-excel px-4 py-2 text-sm"><i class="fa-regular fa-file-excel mr-1"></i>Export Excel</button>
                        <button onclick="document.getElementById('viewReportModal').classList.remove('open')" class="btn-primary px-6 py-2">Close</button>
                    </div>
                `;
            }

            document.getElementById('viewReportContent').innerHTML = html;
            document.getElementById('viewReportModal').classList.add('open');
        };

        window.toggleApprove = function(id, type) {
            const items = type === 'report' ? reports : issues;
            const item = items.find(r => r.id === id);
            if (!item || item.approved) return;
            const name = prompt('Enter your name for approval:');
            if (!name) return;
            item.approved = true;
            item.approved_by = name;
            item.approved_date = new Date().toISOString().split('T')[0];
            type === 'report' ? saveReports() : saveIssues();
            showToast(`${type === 'report' ? 'Report' : 'Issue'} approved`);
            renderReports(); renderIssues();
        };

        window.editReport = function(id, type) {
            const item = type === 'report' ? reports.find(r => r.id === id) : null;
            if (!item) return;
            document.getElementById('editReportId').value = id;
            document.getElementById('editReportType').value = type;
            document.getElementById('editCompany').value = item.company;
            document.getElementById('editDepartment').value = item.department || '';
            document.getElementById('editEngineer').value = item.engineer || '';
            document.getElementById('editDate').value = item.date;
            document.getElementById('editTotal').value = item.total;
            document.getElementById('editWorking').value = item.working;
            document.getElementById('editFaulty').value = item.faulty;
            document.getElementById('editRemarks').value = item.remarks || '';
            document.getElementById('editReportModal').classList.add('open');
        };

        window.deleteReport = function(id, type) {
            deleteId = id; deleteType = type;
            document.getElementById('deleteBackdrop').classList.add('open');
        };

        // Event bindings
        document.getElementById('closeViewReport').onclick = () => document.getElementById('viewReportModal').classList.remove('open');
        document.getElementById('closeEditReport').onclick = () => document.getElementById('editReportModal').classList.remove('open');
        document.getElementById('cancelEditReport').onclick = () => document.getElementById('editReportModal').classList.remove('open');
        document.getElementById('cancelDelete').onclick = () => { deleteId = null; deleteType = null; document.getElementById('deleteBackdrop').classList.remove('open'); };

        document.getElementById('confirmDelete').onclick = () => {
            if (deleteId !== null) {
                if (deleteType === 'report') { reports = reports.filter(r => r.id !== deleteId); saveReports(); }
                else { issues = issues.filter(r => r.id !== deleteId); saveIssues(); }
                const t = deleteType; deleteId = null; deleteType = null;
                document.getElementById('deleteBackdrop').classList.remove('open');
                showToast(`${t === 'report' ? 'Report' : 'Issue'} deleted`, true);
                renderReports(); renderIssues();
            }
        };

        document.getElementById('editReportForm').addEventListener('submit', e => {
            e.preventDefault();
            const id = Number(document.getElementById('editReportId').value);
            const item = reports.find(r => r.id === id);
            if (!item) return;
            item.company = document.getElementById('editCompany').value;
            item.department = document.getElementById('editDepartment').value;
            item.engineer = document.getElementById('editEngineer').value;
            item.date = document.getElementById('editDate').value;
            item.total = Number(document.getElementById('editTotal').value);
            item.working = Number(document.getElementById('editWorking').value);
            item.faulty = Number(document.getElementById('editFaulty').value);
            item.remarks = document.getElementById('editRemarks').value;
            saveReports();
            document.getElementById('editReportModal').classList.remove('open');
            showToast('Report updated');
            renderReports();
        });

        // Filters
        document.getElementById('searchReport').addEventListener('input', renderReports);
        document.getElementById('filterApprove').addEventListener('change', renderReports);
        document.getElementById('filterCompany').addEventListener('change', renderReports);
        document.getElementById('resetReportFilters').onclick = () => {
            document.getElementById('searchReport').value = '';
            document.getElementById('filterApprove').value = '';
            document.getElementById('filterCompany').value = '';
            renderReports(); showToast('Filters reset');
        };
        document.getElementById('searchIssues').addEventListener('input', renderIssues);
        document.getElementById('filterIssueStatus').addEventListener('change', renderIssues);
        document.getElementById('resetIssueFilters').onclick = () => {
            document.getElementById('searchIssues').value = '';
            document.getElementById('filterIssueStatus').value = '';
            renderIssues(); showToast('Filters reset');
        };

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
            });
        });

        // Sidebar
        const sidebar = document.getElementById('sidebar');
        document.getElementById('sidebarCollapseBtn').onclick = () => {
            sidebar.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
        };
        if (localStorage.getItem('sidebarCollapsed') === 'true') sidebar.classList.add('collapsed');
        document.getElementById('sidebarToggleBtn').onclick = () => {
            sidebar.classList.toggle('open');
            document.getElementById('overlay').classList.toggle('hidden');
        };
        document.getElementById('overlay').onclick = () => {
            sidebar.classList.remove('open');
            document.getElementById('overlay').classList.add('hidden');
        };

        // Profile dropdown
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');
        profileBtn.onclick = e => { e.stopPropagation(); profileDropdown.classList.toggle('open'); };
        document.addEventListener('click', e => { if (!profileBtn.contains(e.target)) profileDropdown.classList.remove('open'); });

        // Logout
        document.getElementById('logoutBtn').onclick = () => { profileDropdown.classList.remove('open'); document.getElementById('logoutBackdrop').classList.add('open'); };
        document.getElementById('cancelLogout').onclick = () => document.getElementById('logoutBackdrop').classList.remove('open');
        document.getElementById('confirmLogout').onclick = () => { sessionStorage.removeItem('amc_session'); setTimeout(() => { document.getElementById('logoutBackdrop').classList.remove('open'); window.location.href = '/page/login.html'; }, 300); };

        // Init
        renderReports();
        renderIssues();

    })();
    </script>
</body>
</html>
